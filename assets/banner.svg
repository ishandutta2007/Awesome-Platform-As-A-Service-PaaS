<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.5" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 46px; fill: url(#titleGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
    .badge-text { font-family: monospace; font-size: 14px; fill: #58a6ff; font-weight: bold; }
    
    /* Dynamic background animations */
    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.08); }
      100% { opacity: 0.2; transform: scale(1); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-30px) translateX(20px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .pulsing-orb { transform-origin: center; animation: pulse 6s infinite ease-in-out; }
    .particle { animation: floatParticle 8s infinite ease-in-out; }
    .flowing-line { stroke-dasharray: 10, 10; animation: dash 3s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic Glowing Orbs in Background (behind content) -->
  <circle cx="150" cy="100" r="140" fill="#1f6feb" opacity="0.25" class="pulsing-orb" filter="url(#glow)"/>
  <circle cx="1050" cy="250" r="160" fill="#8957e5" opacity="0.2" class="pulsing-orb" filter="url(#glow)" style="animation-delay: -3s;"/>

  <!-- Dynamic Network Connection Lines (Background) -->
  <path d="M 100,280 Q 300,180 600,250 T 1100,120" fill="none" stroke="#30363d" stroke-width="2" />
  <path d="M 100,280 Q 300,180 600,250 T 1100,120" fill="none" stroke="#58a6ff" stroke-width="2" class="flowing-line" opacity="0.6"/>

  <path d="M 50,80 Q 400,300 800,100 T 1150,280" fill="none" stroke="#30363d" stroke-width="2" />
  <path d="M 50,80 Q 400,300 800,100 T 1150,280" fill="none" stroke="#bc8cff" stroke-width="2" class="flowing-line" opacity="0.4" style="animation-delay: -1.5s;"/>

  <!-- Dynamic Particles (Background) -->
  <circle cx="250" cy="120" r="4" fill="#58a6ff" class="particle"/>
  <circle cx="450" cy="280" r="6" fill="#bc8cff" class="particle" style="animation-delay: -2s;"/>
  <circle cx="750" cy="80" r="5" fill="#3fb950" class="particle" style="animation-delay: -4s;"/>
  <circle cx="950" cy="220" r="4" fill="#f0883e" class="particle" style="animation-delay: -1s;"/>

  <!-- Architectural Background Cards (Decorative, subtle) -->
  <rect x="820" y="50" width="320" height="220" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
  <text x="840" y="85" font-family="sans-serif" font-size="14" fill="#8b949e" font-weight="bold">☁️ PaaS Ecosystem Architecture</text>
  
  <!-- Mini Flowchart Inside Decorative Card -->
  <rect x="840" y="105" width="130" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="855" y="130" font-family="sans-serif" font-size="12" fill="#c9d1d9">🚀 App Source</text>
  
  <rect x="1000" y="105" width="120" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="1015" y="130" font-family="sans-serif" font-size="12" fill="#c9d1d9">⚡ Buildpack</text>
  
  <rect x="840" y="165" width="280" height="45" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1"/>
  <text x="855" y="192" font-family="sans-serif" font-size="12" fill="#c9d1d9">☸️ Container Orchestration &amp; Edge</text>

  <!-- FOREGROUND CONTENT (Guaranteed top visibility) -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <rect x="0" y="55" width="260" height="32" rx="16" fill="#1f6feb" fill-opacity="0.2" stroke="#1f6feb" stroke-width="1"/>
    <text x="16" y="76" class="badge-text">⚡ AWESOME PAAS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Platform As A Service</text>

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle">Curated SaaS Platforms, Self-Hosted PaaS &amp; Container Orchestration</text>
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#8b949e">
      Empowering developers with Heroku alternatives, Kubernetes abstraction &amp; Cloud sovereignty.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 255)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="120" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="15" y="20" font-family="sans-serif" font-size="13" fill="#c9d1d9">🛠️ Self-Hosted</text>

      <!-- Tag 2 -->
      <rect x="130" y="0" width="130" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="145" y="20" font-family="sans-serif" font-size="13" fill="#c9d1d9">🌐 Managed SaaS</text>

      <!-- Tag 3 -->
      <rect x="270" y="0" width="145" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="285" y="20" font-family="sans-serif" font-size="13" fill="#c9d1d9">🐳 Docker &amp; K8s</text>
    </g>
  </g>
</svg>
